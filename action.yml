name: 'SkilLock CI'
description: 'Pin approved AI Skill behavior; block unapproved drift in CI.'
author: 'SkilLock'
branding:
  icon: 'lock'
  color: 'blue'

inputs:
  pin-binary:
    description: |
      skil-lock release tag to download (e.g. v0.1.0 or v0.1.0-rc1).
      REQUIRED. No floating refs — pin to an exact tag.
    required: true
  comment:
    description: 'Post or update a PR comment with the capability diff. true|false.'
    required: false
    default: 'true'
  path:
    description: 'Repository root containing .claude/skills/ or .codex/skills/.'
    required: false
    default: '.'
  sarif:
    description: |
      When true, also produce a SARIF v2.1.0 report and upload it to GitHub
      Code Scanning so findings show up in the repo's Security tab.
      Requires the calling workflow to grant `security-events: write`.
      true|false.
    required: false
    default: 'false'
  verify-signature:
    description: |
      Cosign keyless verification of the release's checksums.txt before it
      is trusted for the sha256 comparison. Releases v0.2.0+ ship
      checksums.txt.sig/.pem signed by the skil-lock release workflow via
      GitHub OIDC.
      'auto' (default): verify when cosign is available and the pinned
      release ships a signature; warn and fall back to checksum-only
      otherwise. 'true': require verification, fail if cosign or the
      signature is missing. 'false': skip.
    required: false
    default: 'auto'

runs:
  using: 'composite'
  steps:
    - name: Validate inputs
      shell: bash
      run: |
        set -euo pipefail
        PIN='${{ inputs.pin-binary }}'
        if [[ -z "$PIN" ]]; then
          echo "::error::pin-binary input is required (no floating refs)."
          exit 1
        fi
        if ! [[ "$PIN" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-rc[0-9]+)?$ ]]; then
          echo "::error::pin-binary must look like v0.1.0 or v0.1.0-rc1 (got '$PIN')."
          exit 1
        fi

    - name: Detect platform
      id: platform
      shell: bash
      run: |
        set -euo pipefail
        case "$(uname -s)" in
          Linux)  os=linux ;;
          Darwin) os=darwin ;;
          *) echo "::error::unsupported OS: $(uname -s)"; exit 1 ;;
        esac
        case "$(uname -m)" in
          x86_64|amd64) arch=amd64 ;;
          aarch64|arm64) arch=arm64 ;;
          *) echo "::error::unsupported arch: $(uname -m)"; exit 1 ;;
        esac
        echo "os=$os" >> "$GITHUB_OUTPUT"
        echo "arch=$arch" >> "$GITHUB_OUTPUT"

    - name: Download + verify binary
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        VERSION: ${{ inputs.pin-binary }}
        OS: ${{ steps.platform.outputs.os }}
        ARCH: ${{ steps.platform.outputs.arch }}
        VERIFY_SIG: ${{ inputs.verify-signature }}
      run: |
        set -euo pipefail
        STAGE="${RUNNER_TEMP}/skil-lock-bin"
        rm -rf "$STAGE" && mkdir -p "$STAGE"
        cd "$STAGE"

        VER_NO_V="${VERSION#v}"
        ARCHIVE="skil-lock_${VER_NO_V}_${OS}_${ARCH}.tar.gz"
        CHECKSUMS="checksums.txt"

        gh release download "$VERSION" \
          --repo skills-lock/skil-lock \
          --pattern "$ARCHIVE" \
          --pattern "$CHECKSUMS" \
          --clobber

        # Authenticate checksums.txt itself before trusting it: the sha256
        # comparison below only proves the archive matches the checksum
        # file, not that the checksum file came from the skil-lock release
        # workflow. Keyless cosign verification pins it to the release
        # workflow's GitHub OIDC identity.
        case "$VERIFY_SIG" in
          auto|true|false) ;;
          *) echo "::error::verify-signature must be auto, true, or false (got '$VERIFY_SIG')."; exit 1 ;;
        esac
        if [[ "$VERIFY_SIG" != "false" ]]; then
          SIG_OK=1
          gh release download "$VERSION" \
            --repo skills-lock/skil-lock \
            --pattern "${CHECKSUMS}.sig" \
            --pattern "${CHECKSUMS}.pem" \
            --clobber 2>/dev/null || SIG_OK=0
          if ! command -v cosign >/dev/null 2>&1; then
            if [[ "$VERIFY_SIG" == "true" ]]; then
              echo "::error::verify-signature=true but cosign is not installed on this runner."
              exit 1
            fi
            echo "::warning::cosign not found; falling back to checksum-only verification."
          elif [[ "$SIG_OK" -eq 0 ]]; then
            if [[ "$VERIFY_SIG" == "true" ]]; then
              echo "::error::verify-signature=true but $VERSION ships no ${CHECKSUMS}.sig/.pem (signatures start at v0.2.0)."
              exit 1
            fi
            echo "::warning::$VERSION ships no checksums signature (pre-v0.2.0?); falling back to checksum-only verification."
          else
            cosign verify-blob \
              --certificate "${CHECKSUMS}.pem" \
              --signature "${CHECKSUMS}.sig" \
              --certificate-identity-regexp '^https://github\.com/skills-lock/skil-lock/\.github/workflows/release\.yml@refs/tags/v' \
              --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \
              "$CHECKSUMS"
            echo "checksums.txt signature verified (cosign keyless, release workflow identity)."
          fi
        fi

        EXPECTED=$(awk -v f="$ARCHIVE" '$2==f {print $1}' "$CHECKSUMS")
        if [[ -z "$EXPECTED" ]]; then
          echo "::error::checksum entry missing for $ARCHIVE in $CHECKSUMS"
          exit 1
        fi
        ACTUAL=$(sha256sum "$ARCHIVE" | awk '{print $1}')
        if [[ "$EXPECTED" != "$ACTUAL" ]]; then
          echo "::error::checksum mismatch for $ARCHIVE — expected $EXPECTED, got $ACTUAL"
          exit 1
        fi

        tar -xzf "$ARCHIVE"
        chmod +x skil-lock
        echo "$STAGE" >> "$GITHUB_PATH"

    - name: Verify skills.lock exists
      shell: bash
      working-directory: ${{ inputs.path }}
      run: |
        if [[ ! -f skills.lock ]]; then
          echo "::error::skills.lock not found in '${{ inputs.path }}'. Run 'skil-lock init --baseline .' locally and commit it before enabling this Action."
          exit 1
        fi

    - name: Run skil-lock ci
      id: ci
      shell: bash
      working-directory: ${{ inputs.path }}
      run: |
        set -uo pipefail
        OUT="${RUNNER_TEMP}/skil-lock-ci-output.md"
        ERR="${RUNNER_TEMP}/skil-lock-ci-stderr.txt"
        set +e
        skil-lock ci > "$OUT" 2> "$ERR"
        EXIT=$?
        set -e
        cat "$ERR" >&2 || true
        cat "$OUT" || true
        echo "exit-code=$EXIT" >> "$GITHUB_OUTPUT"

    - name: Generate SARIF
      if: ${{ inputs.sarif == 'true' }}
      id: sarif
      shell: bash
      working-directory: ${{ inputs.path }}
      run: |
        set -uo pipefail
        SARIF_FILE="${RUNNER_TEMP}/skil-lock.sarif"
        # The SARIF rendering is independent of the exit code: a clean diff
        # still emits a valid (results-empty) document, which is exactly
        # what GitHub Code Scanning needs to clear stale findings.
        set +e
        skil-lock ci --format sarif > "$SARIF_FILE" 2>/dev/null
        set -e
        echo "sarif-file=$SARIF_FILE" >> "$GITHUB_OUTPUT"

    - name: Upload SARIF to Code Scanning
      if: ${{ inputs.sarif == 'true' }}
      uses: github/codeql-action/upload-sarif@v4
      with:
        sarif_file: ${{ steps.sarif.outputs.sarif-file }}
        category: skil-lock

    - name: Upsert PR comment
      if: ${{ github.event_name == 'pull_request' && inputs.comment == 'true' }}
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        REPO: ${{ github.repository }}
        PR: ${{ github.event.pull_request.number }}
      run: |
        set -euo pipefail
        MARKER='<!-- skil-lock:pr-comment -->'
        OUT="${RUNNER_TEMP}/skil-lock-ci-output.md"
        BODY="${RUNNER_TEMP}/skil-lock-pr-comment.md"
        {
          printf '%s\n\n' "$MARKER"
          cat "$OUT"
        } > "$BODY"

        # gh api -f does not read @file like curl does. Wrap the body as a
        # JSON payload via jq -Rs (which round-trips arbitrary text safely)
        # and pipe it through --input - so newlines and quotes survive.
        PAYLOAD=$(jq -Rs '{body: .}' < "$BODY")

        EXISTING=$(gh api "/repos/${REPO}/issues/${PR}/comments" \
          --paginate \
          --jq ".[] | select(.body | startswith(\"$MARKER\")) | .id" | head -n1 || true)

        if [[ -n "$EXISTING" ]]; then
          printf '%s' "$PAYLOAD" | gh api --method PATCH \
            "/repos/${REPO}/issues/comments/${EXISTING}" --input - >/dev/null
          echo "Updated existing PR comment (id=$EXISTING)."
        else
          printf '%s' "$PAYLOAD" | gh api --method POST \
            "/repos/${REPO}/issues/${PR}/comments" --input - >/dev/null
          echo "Created new PR comment."
        fi

    - name: Propagate ci exit code
      shell: bash
      run: |
        EXIT=${{ steps.ci.outputs.exit-code }}
        if [[ "$EXIT" -ne 0 ]]; then
          echo "::error::skil-lock ci exited $EXIT — see PR comment for details."
          exit "$EXIT"
        fi
